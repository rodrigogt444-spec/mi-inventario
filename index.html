<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUINIELAS MEXICO</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        background: #ffffff;
        background-image:
            radial-gradient(circle at 0% 0%, rgba(255, 71, 87, 0.08) 0%, transparent 35%),
            radial-gradient(circle at 100% 0%, rgba(52, 152, 219, 0.08) 0%, transparent 35%),
            radial-gradient(circle at 50% 100%, rgba(46, 204, 113, 0.08) 0%, transparent 40%);
        min-height: 100vh;
        padding: 18px;
        color: #1e293b;
    }

    .contenedor {
        max-width: 720px;
        margin: 0 auto;
    }

    /* ENCABEZADO */
    header {
        text-align: center;
        margin-bottom: 20px;
        padding: 24px 20px;
        background: #ffffff;
        border: 2px solid #f1f5f9;
        border-radius: 20px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 8px 30px rgba(30, 41, 59, 0.06);
    }

    header::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 5px;
        background: linear-gradient(90deg,
            #ff4757 0%, #ffa502 25%,
            #2ed573 50%, #1e90ff 75%,
            #a55eea 100%);
        background-size: 200% 100%;
        animation: barra 6s linear infinite;
    }

    @keyframes barra {
        0%   { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
    }

    header h1 {
        font-size: 26px;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-weight: 900;
        background: linear-gradient(135deg, #ff4757, #1e90ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 6px;
    }

    header h2 {
        font-size: 13px;
        font-weight: 700;
        color: #94a3b8;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    /* CAMPO DE NOMBRE */
    .campo-nombre {
        background: #ffffff;
        border: 2px solid #f1f5f9;
        border-radius: 16px;
        padding: 14px 16px;
        margin-bottom: 14px;
        box-shadow: 0 6px 20px rgba(30, 41, 59, 0.05);
        position: relative;
    }

    .campo-nombre::before {
        content: "";
        position: absolute;
        left: 0; top: 15%; bottom: 15%;
        width: 4px;
        background: linear-gradient(180deg, #ff4757, #ffa502);
        border-radius: 0 4px 4px 0;
    }

    .campo-nombre label {
        display: block;
        font-size: 11px;
        font-weight: 800;
        color: #64748b;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 6px;
        padding-left: 6px;
    }

    .campo-nombre input {
        width: 100%;
        padding: 12px 14px;
        border: 2px solid #f1f5f9;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        color: #1e293b;
        background: #f8fafc;
        outline: none;
        transition: all 0.2s;
        font-family: inherit;
    }

    .campo-nombre input::placeholder {
        color: #cbd5e1;
        font-weight: 500;
    }

    .campo-nombre input:focus {
        border-color: #1e90ff;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(30, 144, 255, 0.12);
    }

    /* PARTIDO */
    .partido {
        background: #ffffff;
        border: 2px solid #f1f5f9;
        border-radius: 14px;
        padding: 12px;
        margin-bottom: 8px;
        transition: all 0.25s;
        position: relative;
        overflow: hidden;
        box-shadow: 0 3px 10px rgba(30, 41, 59, 0.04);
    }

    .partido::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 4px;
        background: linear-gradient(180deg, #2ed573, #1e90ff);
        opacity: 0;
        transition: opacity 0.25s;
    }

    .partido.seleccionado::before { opacity: 1; }

    .partido.seleccionado {
        border-color: #b9f0cb;
        background: #f4fdf7;
    }

    .partido:hover {
        border-color: #cbd5e1;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(30, 41, 59, 0.08);
    }

    .equipos {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
    }

    .equipo {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 13.5px;
        min-width: 0;
        letter-spacing: 0.3px;
        color: #1e293b;
    }

    .equipo.visitante {
        flex-direction: row-reverse;
        text-align: right;
    }

    .escudo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 12px;
        color: #fff;
        flex-shrink: 0;
        box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }

    .nombre-equipo {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .vs {
        font-size: 10px;
        font-weight: 900;
        color: #94a3b8;
        padding: 4px 7px;
        border: 2px solid #f1f5f9;
        border-radius: 6px;
        background: #f8fafc;
        letter-spacing: 1px;
    }

    /* OPCIONES L E V */
    .opciones {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
    }

    .opcion {
        padding: 10px;
        border: 2px solid #f1f5f9;
        background: #f8fafc;
        color: #94a3b8;
        border-radius: 10px;
        font-weight: 900;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
        letter-spacing: 2px;
        font-family: inherit;
    }

    .opcion:hover {
        background: #eef2f7;
        color: #1e293b;
        border-color: #cbd5e1;
    }

    .opcion.local.seleccionada {
        background: linear-gradient(135deg, #2ed573, #17a94a);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 4px 12px rgba(46, 213, 115, 0.4);
    }

    .opcion.empate.seleccionada {
        background: linear-gradient(135deg, #ffa502, #ff7f00);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 4px 12px rgba(255, 165, 2, 0.4);
    }

    .opcion.visitante.seleccionada {
        background: linear-gradient(135deg, #1e90ff, #0066cc);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 4px 12px rgba(30, 144, 255, 0.4);
    }

    /* INFO */
    .info {
        background: linear-gradient(135deg, #f8fafc, #ffffff);
        border: 2px solid #f1f5f9;
        border-radius: 16px;
        padding: 16px;
        text-align: center;
        margin-top: 16px;
        box-shadow: 0 6px 20px rgba(30, 41, 59, 0.05);
    }

    .precio {
        color: #ff7f00;
        font-weight: 900;
        font-size: 13px;
        margin-bottom: 6px;
        letter-spacing: 0.5px;
    }

    .informes {
        font-size: 13px;
        margin-bottom: 8px;
        color: #64748b;
        font-weight: 600;
    }

    .informes strong { color: #2ed573; }

    .total {
        font-size: 26px;
        font-weight: 900;
        background: linear-gradient(135deg, #2ed573, #1e90ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 1px;
    }

    .contador {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 4px;
        letter-spacing: 0.5px;
        font-weight: 700;
    }

    /* BOTONES PEQUEÑOS (3 EN LÍNEA) */
    .acciones-pequenas {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-top: 16px;
    }

    .btn-peq {
        padding: 10px 6px;
        border: none;
        border-radius: 10px;
        font-weight: 800;
        font-size: 11.5px;
        cursor: pointer;
        transition: all 0.2s;
        letter-spacing: 0.5px;
        color: #fff;
        text-transform: uppercase;
        font-family: inherit;
        white-space: nowrap;
    }

    .btn-peq:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(30, 41, 59, 0.18);
    }

    .btn-peq:active { transform: translateY(0); }

    .btn-limpiar {
        background: linear-gradient(135deg, #94a3b8, #64748b);
    }

    .btn-agregar {
        background: linear-gradient(135deg, #1e90ff, #0066cc);
    }

    .btn-aleatorio {
        background: linear-gradient(135deg, #ffa502, #ff7f00);
    }

    /* BOTÓN ENVIAR (GRANDE) */
    .btn-enviar {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 14px;
        font-weight: 900;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.25s;
        letter-spacing: 1.5px;
        color: #fff;
        text-transform: uppercase;
        font-family: inherit;
        background: linear-gradient(135deg, #25D366, #128C7E);
        box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
        margin-top: 10px;
    }

    .btn-enviar:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 28px rgba(37, 211, 102, 0.5);
    }

    .btn-enviar:active { transform: translateY(0); }

    /* LISTA DE PRONÓSTICOS GUARDADOS */
    .lista-pronosticos {
        margin-top: 14px;
        background: #ffffff;
        border: 2px solid #f1f5f9;
        border-radius: 16px;
        padding: 14px 16px;
        box-shadow: 0 6px 20px rgba(30, 41, 59, 0.05);
        display: none;
    }

    .lista-pronosticos.visible { display: block; }

    .lista-pronosticos h3 {
        font-size: 11px;
        font-weight: 900;
        color: #64748b;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 2px dashed #e2e8f0;
    }

    .item-pronostico {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: #f8fafc;
        border-radius: 10px;
        margin-bottom: 6px;
        border-left: 4px solid #1e90ff;
        transition: all 0.2s;
    }

    .item-pronostico:hover {
        background: #eef3f9;
    }

    .item-pronostico .num {
        background: linear-gradient(135deg, #1e293b, #334155);
        color: #fff;
        font-weight: 900;
        font-size: 12px;
        min-width: 28px;
        height: 28px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .item-pronostico .letras {
        font-weight: 900;
        font-size: 14px;
        color: #1e293b;
        letter-spacing: 3px;
        flex: 1;
        font-family: 'Courier New', monospace;
    }

    .item-pronostico .borrar-item {
        background: rgba(255, 71, 87, 0.1);
        color: #ff4757;
        border: 1px solid rgba(255, 71, 87, 0.25);
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s;
    }

    .item-pronostico .borrar-item:hover {
        background: #ff4757;
        color: #fff;
    }

    /* ALERTA */
    .alerta {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%) translateY(-120px);
        background: #ff4757;
        color: #fff;
        padding: 13px 22px;
        border-radius: 12px;
        font-weight: 800;
        font-size: 13.5px;
        box-shadow: 0 10px 30px rgba(255, 71, 87, 0.35);
        transition: transform 0.35s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        z-index: 1000;
        max-width: 90%;
        text-align: center;
        letter-spacing: 0.3px;
    }

    .alerta.mostrar { transform: translateX(-50%) translateY(0); }

    .alerta.exito {
        background: linear-gradient(135deg, #2ed573, #17a94a);
        box-shadow: 0 10px 30px rgba(46, 213, 115, 0.4);
    }

    @media (max-width: 480px) {
        header h1 { font-size: 19px; letter-spacing: 2px; }
        header h2 { font-size: 11px; }
        .nombre-equipo { font-size: 11.5px; }
        .escudo { width: 30px; height: 30px; font-size: 10px; }
        .opcion { padding: 8px; font-size: 12px; }
        .btn-peq { font-size: 10.5px; padding: 9px 4px; }
        .total { font-size: 22px; }
        .btn-enviar { font-size: 13px; padding: 14px; }
        .item-pronostico .letras { font-size: 12px; letter-spacing: 2px; }
    }
</style>
</head>
<body>

<div class="contenedor">

    <header>
        <h1>QUINIELAS MEXICO</h1>
        <h2>LIGA MX · JORNADA 12</h2>
    </header>

    <!-- CAMPO DE NOMBRE -->
    <div class="campo-nombre">
        <label for="nombreJugador">👤 Nombre del jugador</label>
        <input
            type="text"
            id="nombreJugador"
            placeholder="Escribe tu nombre aquí..."
            autocomplete="off"
        >
    </div>

    <!-- PARTIDOS (solo la quiniela ACTIVA) -->
    <div id="listaPartidos"></div>

    <!-- INFO -->
    <div class="info">
        <p class="precio">$20.00 POR QUINIELA &nbsp;|&nbsp; CIERRE: VIERNES 2:00 P.M.</p>
        <p class="informes">Informes: <strong>+52 563 070 1352</strong></p>
        <p class="total">TOTAL: $<span id="total">0.00</span></p>
        <p class="contador" id="contador">0 quiniela(s)</p>
    </div>

    <!-- BOTONES PEQUEÑOS -->
    <div class="acciones-pequenas">
        <button class="btn-peq btn-limpiar" onclick="limpiar()">🧹 Limpiar</button>
        <button class="btn-peq btn-agregar" onclick="agregarQuiniela()">➕ Agregar</button>
        <button class="btn-peq btn-aleatorio" onclick="aleatorio()">🎲 Aleatorio</button>
    </div>

    <!-- BOTÓN ENVIAR -->
    <button class="btn-enviar" onclick="enviar()">📲 Enviar por WhatsApp</button>

    <!-- LISTA DE PRONÓSTICOS GUARDADOS -->
    <div class="lista-pronosticos" id="listaPronosticos">
        <h3>📋 Pronósticos guardados</h3>
        <div id="itemsPronosticos"></div>
    </div>

</div>

<div class="alerta" id="alerta"></div>

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const PRECIO_QUINIELA = 20;
const WHATSAPP        = "5630701352";
const MAX_QUINIELAS   = 10;

const partidos = [
    "NECAXA|ATLAS",
    "ATLANTE|PUMAS",
    "TIJUANA|PUEBLA",
    "SANTOS|QUERÉTARO",
    "CHIVAS|TIGRES",
    "LEÓN|AMÉRICA",
    "TOLUCA|SAN LUIS",
    "CRUZ AZUL|JUÁREZ",
    "MONTERREY|PACHUCA"
];

const coloresEquipos = {
    "NECAXA":"#E30613","ATLAS":"#CC0000","ATLANTE":"#0055A4","PUMAS":"#002B5C",
    "TIJUANA":"#D40026","PUEBLA":"#003366","SANTOS":"#007A33","QUERÉTARO":"#0033A0",
    "CHIVAS":"#C8102E","TIGRES":"#FFB81C","LEÓN":"#007A33","AMÉRICA":"#FFCC00",
    "TOLUCA":"#D40026","SAN LUIS":"#003DA5","CRUZ AZUL":"#0033A0","JUÁREZ":"#00A94F",
    "MONTERREY":"#0033A0","PACHUCA":"#003DA5"
};

/* ============================================================
   ESTADO
   ============================================================ */
// Selección de la quiniela ACTIVA (la que se ve en la pantalla)
let seleccionActual = {};

// Quinielas ya GUARDADAS con el botón Agregar
// guardadas = [ { id: 1, pronosticos: ["L","E","V",...] }, ... ]
let guardadas = [];
let siguienteId = 1;

/* ============================================================
   RENDER DE PARTIDOS (solo la activa)
   ============================================================ */
function obtenerIniciales(nombre) {
    const partes = nombre.split(" ");
    if (partes.length === 1) return nombre.substring(0, 2).toUpperCase();
    return (partes[0][0] + partes[1][0]).toUpperCase();
}

function renderPartidos() {
    const cont = document.getElementById("listaPartidos");
    cont.innerHTML = "";

    partidos.forEach((partido, index) => {
        const [local, visitante] = partido.split("|");
        const sel = seleccionActual[index] || null;

        const card = document.createElement("div");
        card.className = "partido" + (sel ? " seleccionado" : "");

        card.innerHTML = `
            <div class="equipos">
                <div class="equipo local">
                    <div class="escudo" style="background:${coloresEquipos[local] || '#555'}">${obtenerIniciales(local)}</div>
                    <span class="nombre-equipo">${local}</span>
                </div>
                <span class="vs">VS</span>
                <div class="equipo visitante">
                    <div class="escudo" style="background:${coloresEquipos[visitante] || '#555'}">${obtenerIniciales(visitante)}</div>
                    <span class="nombre-equipo">${visitante}</span>
                </div>
            </div>
            <div class="opciones">
                <button class="opcion local ${sel === 'L' ? 'seleccionada' : ''}" onclick="marcar(${index},'L')">L</button>
                <button class="opcion empate ${sel === 'E' ? 'seleccionada' : ''}" onclick="marcar(${index},'E')">E</button>
                <button class="opcion visitante ${sel === 'V' ? 'seleccionada' : ''}" onclick="marcar(${index},'V')">V</button>
            </div>
        `;
        cont.appendChild(card);
    });

    actualizarInfo();
}

/* ============================================================
   RENDER DE LA LISTA DE PRONÓSTICOS GUARDADOS
   ============================================================ */
function renderListaGuardadas() {
    const cont = document.getElementById("itemsPronosticos");
    const wrapper = document.getElementById("listaPronosticos");

    cont.innerHTML = "";

    if (guardadas.length === 0) {
        wrapper.classList.remove("visible");
        return;
    }

    wrapper.classList.add("visible");

    guardadas.forEach((q, idx) => {
        const item = document.createElement("div");
        item.className = "item-pronostico";

        const letras = q.pronosticos.join(" ");

        item.innerHTML = `
            <div class="num">${q.id}</div>
            <div class="letras">${letras}</div>
            <button class="borrar-item" onclick="borrarGuardada(${idx})">✕</button>
        `;
        cont.appendChild(item);
    });
}

/* ============================================================
   INFO (TOTAL)
   ============================================================ */
function actualizarInfo() {
    const total = guardadas.length * PRECIO_QUINIELA;
    document.getElementById("total").textContent = total.toFixed(2);
    document.getElementById("contador").textContent =
        `${guardadas.length} quiniela(s)`;
}

/* ============================================================
   ACCIONES
   ============================================================ */
function marcar(index, tipo) {
    if (seleccionActual[index] === tipo) {
        delete seleccionActual[index];
    } else {
        seleccionActual[index] = tipo;
    }
    renderPartidos();
}

function agregarQuiniela() {
    const numSel = Object.keys(seleccionActual).length;

    // VALIDACIÓN: debe estar completa
    if (numSel < partidos.length) {
        mostrarAlerta(`⚠️ Completa los ${partidos.length} partidos antes de agregar`);
        return;
    }

    if (guardadas.length >= MAX_QUINIELAS) {
        mostrarAlerta(`Máximo ${MAX_QUINIELAS} quinielas`);
        return;
    }

    // Guardar la quiniela activa con su ID
    const pronosticos = partidos.map((_, i) => seleccionActual[i]);
    guardadas.push({ id: siguienteId, pronosticos });
    siguienteId++;

    // Limpiar selección activa para la siguiente quiniela
    seleccionActual = {};

    renderPartidos();
    renderListaGuardadas();
    actualizarInfo();
    mostrarAlerta(`✅ Quiniela #${siguienteId - 1} guardada`, true);
}

function borrarGuardada(index) {
    // Renumerar los siguientes IDs
    guardadas.splice(index, 1);
    renderListaGuardadas();
    actualizarInfo();
    mostrarAlerta("Quiniela eliminada");
}

function limpiar() {
    seleccionActual = {};
    guardadas = [];
    siguienteId = 1;
    document.getElementById("nombreJugador").value = "";
    renderPartidos();
    renderListaGuardadas();
    actualizarInfo();
    mostrarAlerta("Todo limpiado");
}

function aleatorio() {
    const opciones = ["L", "E", "V"];
    seleccionActual = {};
    partidos.forEach((_, i) => {
        seleccionActual[i] = opciones[Math.floor(Math.random() * 3)];
    });
    renderPartidos();
    mostrarAlerta("Combinación aleatoria generada", true);
}

function enviar() {
    const nombre = document.getElementById("nombreJugador").value.trim();

    // VALIDACIÓN 1: Nombre
    if (!nombre) {
        mostrarAlerta("⚠️ Escribe tu nombre");
        document.getElementById("nombreJugador").focus();
        return;
    }

    // VALIDACIÓN 2: Al menos 1 quiniela guardada
    if (guardadas.length === 0) {
        mostrarAlerta("⚠️ Agrega al menos una quiniela");
        return;
    }

    // CONSTRUIR MENSAJE
    let mensaje = `*Nombre:* ${nombre}\n\n`;

    guardadas.forEach((q) => {
        mensaje += `*${q.id} =* ${q.pronosticos.join(" ")}\n`;
    });

    const total = guardadas.length * PRECIO_QUINIELA;
    mensaje += `\n*Monto total: $${total}.00*`;

    const url = `https://wa.me/52${WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
    window.open(url, "_blank");

    mostrarAlerta("✅ Abriendo WhatsApp...", true);
}

/* ============================================================
   ALERTA
   ============================================================ */
let alertaTimeout = null;
function mostrarAlerta(texto, exito = false) {
    const alerta = document.getElementById("alerta");
    alerta.textContent = texto;
    alerta.className = "alerta mostrar" + (exito ? " exito" : "");
    clearTimeout(alertaTimeout);
    alertaTimeout = setTimeout(() => {
        alerta.className = "alerta" + (exito ? " exito" : "");
    }, 2800);
}
